# Opt-in standalone deployment, NOT an overlay for docker-compose.yml.
# Select explicitly: docker compose -f docker-compose.postgres.yml ...
# Enables the existing PostgreSQL AUTH/CONFIG store as well as usage persistence.
# Read docs/usage-persistence.md before migrating an existing installation.
services:
  cli-proxy-api:
    # CLI_PROXY_IMAGE still selects the image to run. Builds are explicit; see docs.
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEPLOY: ${DEPLOY:-}
      # A nonempty password also enables remote management; restrict access.
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
      # This file is ONLY for the bundled DB. External DB deployments do not use it.
      PGSTORE_DSN: postgresql://${POSTGRES_USER:-cliproxy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the bundled database}@postgres:5432/${POSTGRES_DB:-cliproxy}?sslmode=disable
      PGSTORE_SCHEMA: ${PGSTORE_SCHEMA:-public}
      # The CLI adds /pgstore beneath this absolute container path.
      PGSTORE_LOCAL_PATH: ${PGSTORE_LOCAL_PATH:-/var/lib/cliproxy}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      # PGSTORE bootstraps from config.example.yaml, NOT the usual config.yaml.
      # An existing database config/spool config takes precedence over this seed.
      - type: bind
        source: ${CLI_PROXY_CONFIG_PATH:-./config.yaml}
        target: /CLIProxyAPI/config.example.yaml
        read_only: true
        bind:
          create_host_path: false
      # Dedicated spool: never bind an existing auth directory here. Bootstrap
      # rebuilds spool auths from DB; local credentials are not automatically imported.
      - type: volume
        source: postgres-spool
        target: ${PGSTORE_LOCAL_PATH:-/var/lib/cliproxy}
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cliproxy}
      POSTGRES_USER: ${POSTGRES_USER:-cliproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the bundled database}
    # Private Compose network only; no published database port.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-spool:
