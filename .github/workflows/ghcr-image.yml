name: Publish fork image to GHCR

on:
  push:
    # The pushed tag is the version; only v-prefixed tags trigger a publish.
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # Retrying an old commit must not cancel a newer commit's build.
  group: ghcr-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      build_ref: ${{ steps.meta.outputs.build_ref }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the pushed tag as the version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$GITHUB_SHA"
          # The pushed tag itself is the version. Reject malformed tags (e.g.
          # v8.0.5-rc6, missing the dot before the number) so they fail loudly
          # at push time instead of silently producing a mislabeled image.
          version="${GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || (( ${#version} > 128 )); then
            echo "::error::Tag '${version}' is not a valid version tag. Expected v<major>.<minor>.<patch> with an optional prerelease suffix like v8.0.5-rc.7."
            exit 1
          fi
          {
            printf 'image=%s\n' "$image"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'build_date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'build_ref=%s:build-%s-%s\n' "$image" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the native architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          # Run-specific references prevent mixing architectures from two pushes.
          tags: ${{ needs.metadata.outputs.build_ref }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.created=${{ needs.metadata.outputs.build_date }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform image
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          BUILD_REF: ${{ needs.metadata.outputs.build_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The pushed tag is the version, so the version alias always moves.
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$COMMIT" \
            --tag "$IMAGE:$VERSION" \
            "$BUILD_REF-amd64" "$BUILD_REF-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$COMMIT"
          # Only main's head moves latest: rerunning an older tag's workflow
          # must not roll the alias back. Fail closed if the ref check fails.
          main_commit="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          if [[ "$main_commit" == "$COMMIT" ]]; then
            docker buildx imagetools create \
              --tag "$IMAGE:latest" \
              "$IMAGE:sha-$COMMIT"
            promotion='Updated the latest alias.'
          else
            promotion='Main has advanced; published the version image without moving the latest alias.'
          fi
          {
            printf '### Published container\n\n'
            printf -- '- Version image: `%s:%s`\n' "$IMAGE" "$VERSION"
            printf -- '- Built commit: `%s`\n' "$COMMIT"
            printf -- '- Commit image: `%s:sha-%s`\n' "$IMAGE" "$COMMIT"
            printf -- '- Platforms: `linux/amd64`, `linux/arm64`\n'
            printf -- '- %s\n' "$promotion"
          } >> "$GITHUB_STEP_SUMMARY"
